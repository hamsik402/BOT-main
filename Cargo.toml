[workspace]
members = [
    "arb-bot",
    "dex",
    "arb-core",
    "utils",
    "bloxroute-client",
    "jito_searcher_client",
    "jito_protos",
    "config",
    "validators",
    "nextblock_protos",
    "nextblock-client",
    "feed-bridge"
]
resolver = "2"

[profile.release]
#target-cpu= "native"
opt-level = 3
codegen-units = 1
lto = "fat"

[workspace.dependencies]
bs58 = "0.5.0"
log = "0.4.22"
serde_json = "1.0.103"
agave-geyser-plugin-interface = "2.1.0"
solana-logger = "2.1.0"
solana-program = "2.1.0"
solana-client = "2.1.0"
solana-sdk = "2.1.0"
solana-account-decoder = "2.1.0"
solana-address-lookup-table-interface = "2.1.0"
tokio = { version = "1.43.0", features = ["rt-multi-thread", "macros", "time","sync"] }
async-nats = "0.38.0"
zeromq = "0.4.1"
zmq2 = "0.5.0"
bytes = "1.9.0"
spl-token = "7.0.0"
spl-token-2022 = "8.0.1"
base64 = "0.22.1"
bytemuck = {  version  = "1.21.0", features = ["derive"] }
bincode = "1.3.3"
serde = { version = "1.0.215", features = ["derive"] }
#anchor-gen = "0.3.1"
#anchor-lang = ">=0.20"
borsh = { version = "0.9.3", features = ["const-generics"] }
orca_whirlpools_client = "2.0.3"      # ok #2
safe-transmute = "0.11.3"
num-traits = "0.2.19"
num-derive = "0.4.2"
anyhow = "1.0.93"
uint = "0.9.5"
#lazy_static = "1.5.0"
rand = "0.8.5"
ahash = "0.8.11"
